name: Build An Tam Mac check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  # contents: write để bước Release cuối workflow tạo được GitHub Release.
  # Với read thì bước đó sẽ 403 (đã gặp ở PCcheck).
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Audit fixed-light-theme text contrast and required views
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("Sources/AnTamMacCheck/App.swift").read_text()
          health = Path("Sources/AnTamMacCheck/HardwareHealth.swift").read_text()
          keyboard = Path("Sources/AnTamMacCheck/InteractiveInput.swift").read_text()
          assert '.preferredColorScheme(.light)' in app, "Fixed cream UI must force light semantic text"
          assert '.foregroundStyle(ink)' in app, "Main UI must explicitly set dark foreground"
          assert '.foregroundStyle(ink)\n            .background(Color.white' in app, "Cards need dark-on-white text"
          assert 'private var aboutPopup' in app and 'private var report:' in app
          assert 'private var overview:' in app and 'private var testWizard:' in app
          assert 'GroupBox("Battery Analyzer")' in health
          assert 'pressed.contains(key.0)' in keyboard
          def luminance(rgb):
              linear = [v / 12.92 if v <= .04045 else ((v+.055)/1.055)**2.4 for v in rgb]
              return sum(a*b for a,b in zip(linear, [.2126,.7152,.0722]))
          dark = luminance([.16,.21,.29])
          white = luminance([1,1,1])
          cream = luminance([.985,.975,.965])
          assert (white+.05)/(dark+.05) >= 7, "Card text contrast too low"
          assert (cream+.05)/(dark+.05) >= 7, "Dashboard text contrast too low"
          print("Theme static audit passed: light scheme, legible fixed surfaces, required views.")
          PY
      - name: Compile app
        run: swift build -c release
      - name: Render supplied original SVG logo without redrawing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object resources/Greenie-logo.svg)" = "fa5182caff19074776ebf050094eae939364040c"
          brew install librsvg
          rsvg-convert --width 512 --height 512 --output resources/AnTamLogo.png resources/Greenie-logo.svg
          rsvg-convert --width 1000 --height 660 --output resources/MacBookPreview.png resources/MacBookPreview.svg
          test -s resources/MacBookPreview.png
      - name: Generate original-brand macOS app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/AnTamMacCheck.iconset
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" resources/AnTamLogo.png --out "resources/AnTamMacCheck.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -s format png -z "$double" "$double" resources/AnTamLogo.png --out "resources/AnTamMacCheck.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns resources/AnTamMacCheck.iconset -o resources/AnTamMacCheck.icns
          test -s resources/AnTamMacCheck.icns
          iconutil -c iconset resources/AnTamMacCheck.icns -o /tmp/antam-icon-qa.iconset
          test -s /tmp/antam-icon-qa.iconset/icon_512x512.png
      - name: Verify approved sidebar mascot is included
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/MascotSidebar.png
      - name: Generate original stereo speaker-test WAV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          rate = 44100
          melody = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63, 293.66, 261.63]
          out = Path("resources/StereoSpeakerTest.wav")
          with wave.open(str(out), "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              # First four seconds left only, last four seconds right only.
              block = bytearray()
              for n in range(rate * 8):
                  sec = n / rate
                  note = int(sec / 0.5)
                  frequency = melody[min(note % 8, 7)]
                  local = (n % (rate // 2)) / rate
                  fade = min(1.0, local * 18, (0.5 - local) * 18)
                  sample = int(10000 * max(0.0, fade) * (
                      math.sin(2 * math.pi * frequency * sec)
                      + 0.25 * math.sin(2 * math.pi * frequency * 2 * sec)))
                  left, right = (sample, 0) if sec < 4 else (0, sample)
                  block += struct.pack("<hh", left, right)
              w.writeframes(block)
          print("Original stereo test WAV:", out.stat().st_size, "bytes")
          # Regression check: both channels must carry audio, but at separate times.
          with wave.open(str(out), "rb") as w:
              assert w.getnchannels() == 2 and w.getframerate() == rate
              assert w.getnframes() == rate * 8
              w.setpos(rate + 1234)  # left interval (avoid zero-crossing)
              l, r = struct.unpack("<hh", w.readframes(1))
              assert l != 0 and r == 0, (l, r)
              w.setpos(rate * 5 + 1234)  # right interval
              l, r = struct.unpack("<hh", w.readframes(1))
              assert l == 0 and r != 0, (l, r)
          print("Stereo L/R isolation verified.")

          PY
      - name: Create application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/An Tam Mac check.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ".build/release/AnTamMacCheck" "$APP/Contents/MacOS/AnTamMacCheck"
          cp "resources/Info.plist" "$APP/Contents/Info.plist"
          cp "resources/AnTamMacCheck.icns" "$APP/Contents/Resources/AnTamMacCheck.icns"
          cp "resources/StereoSpeakerTest.wav" "$APP/Contents/Resources/StereoSpeakerTest.wav"
          if [ -f "resources/AnTamLogo.png" ]; then
            cp "resources/AnTamLogo.png" "$APP/Contents/Resources/AnTamLogo.png"
          fi
          for asset in MascotSidebar MacBookPreview; do
            cp "resources/$asset.png" "$APP/Contents/Resources/$asset.png"
          done
          chmod +x "$APP/Contents/MacOS/AnTamMacCheck"
          plutil -lint "$APP/Contents/Info.plist"
          # SwiftPM's raw executable is wrapped into a .app above. Sign the
          # *completed bundle* after copying all resources, never before.
          # An ad-hoc signature checks bundle integrity but is NOT Apple
          # Developer ID notarization; quarantine on downloads still needs
          # explicit user approval on their Mac.
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist" | grep -Fx AnTamMacCheck
          test -x "$APP/Contents/MacOS/AnTamMacCheck"
          test -s "$APP/Contents/Resources/StereoSpeakerTest.wav"
          test -s "$APP/Contents/Resources/AnTamMacCheck.icns"
          file "$APP/Contents/MacOS/AnTamMacCheck"
          ditto -c -k --keepParent "$APP" "AnTam-Mac-check-macOS.zip"
          # Verify extracted contents too (not just the pre-ZIP bundle).
          mkdir -p build/verify-zip
          ditto -x -k "AnTam-Mac-check-macOS.zip" build/verify-zip
          codesign --verify --deep --strict --verbose=2 "build/verify-zip/An Tam Mac check.app"
          test -x "build/verify-zip/An Tam Mac check.app/Contents/MacOS/AnTamMacCheck"
      - name: Upload ad-hoc signed development build
        uses: actions/upload-artifact@v4
        with:
          name: AnTam-Mac-check-macOS
          path: AnTam-Mac-check-macOS.zip
          if-no-files-found: error
      # Mỗi build thành công trên main tạo 1 Release riêng (theo mẫu PCcheck):
      # tag build-<số build>-<lần thử> nên không bao giờ trùng, kể cả chạy lại;
      # --latest để bản mới nhất luôn là bản tải ở releases/latest.
      # Chỉ chạy khi push / chạy tay trên main — build của pull request thì không.
      - name: Publish this build as a GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "AnTam-Mac-check-macOS.zip" \
            --title "Build ${{ github.run_number }} (${GITHUB_SHA:0:7})" \
            --generate-notes \
            --latest
          echo "Published release $TAG"
